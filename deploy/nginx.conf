# nginx site for the dashboard. Replace outreach.example.com with your
# subdomain, put this in /etc/nginx/sites-available/outreach, symlink it into
# sites-enabled, then run:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d outreach.example.com
# certbot adds the HTTPS server block and the HTTP->HTTPS redirect for you.

server {
    listen 80;
    listen [::]:80;
    server_name outreach.example.com;

    # Keep the dashboard out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # Gmail sync can take a while
    }
}
